# Builds the Windows package and publishes it as a GitHub release when a version tag (v*) is pushed.
# Only the port is built and packaged; the original game is not needed for that and never included.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build the Windows package
        run: ./gradlew.bat :desktop:packageZip --no-daemon --console=plain
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          3_kotlin_port/desktop/build/distributions/UGH-port-windows.zip
          --title "UGH! port $env:GITHUB_REF_NAME"
          --notes-file .github/release-notes.md

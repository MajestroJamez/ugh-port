; The world's and the characters' textures at most 1024 texels a side for Windows (the game and the editor alike): the
; cook drops the mips above it (step 28). The scans of the Electric Dreams sample come in 4096 and 8192, the imports in
; 2048, but the game's camera is far: the screen shows about 60 pixels a metre at 1920x1080 (120 at 4K, about 240 in
; the close-up shots), the rock's textures cover 2.2-3 m and the ledges' 1.5 m with 1024 (340-680 texels a metre); the
; streamer asked for at most 1024 of nearly every other at 1920x1080, and two mips less of every texture showed no
; change in the quick set, the flights and the close-ups. Not capped: the skies (the skybox group, UghImportAssets),
; the flames' flipbooks (effects, UghMakeFlames), the engine's data textures (no mips: never capped), the UI.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=UGH! remake
Description=UGH! (1992) in Unreal Engine over the C++ game logic

[/Script/UnrealEd.ProjectPackagingSettings]
; loaded by path from code, so the cook does not find them on its own: the engine's shapes and our materials; the
; imported 3D assets, the Electric Dreams assets and the MetaHumans the game uses are named to the cook one by one
; (UghCookList in UghEditorModule.cpp: not their whole folders, which hold assets the game no longer uses)
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Game/Generated")
; enabled plugins cook these whole, the game never uses them: the face trackers of MetaHuman Animator and its live
; link (video of a face to animation; 550 MB), the neural denoiser of the path tracer (100 MB)
+DirectoriesToNeverCook=(Path="/MetaHuman/GenericTracker")
+DirectoriesToNeverCook=(Path="/MetaHumanCoreTech/GenericTracker")
+DirectoriesToNeverCook=(Path="/NNEDenoiser")
; Oodle Kraken as ever, but its slower, tighter level of a distribution build for every package (the same speed to
; decompress)
PackageCompressionLevel_DebugDevelopment=7
PackageCompressionLevel_TestShipping=7
; the shared shader code library, needed by the bundled PSO cache (pso.ps1); its stable keys: DefaultEngine.ini
bShareMaterialShaderCode=True

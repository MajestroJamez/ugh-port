[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=UGH! remake
Description=UGH! (1992) in Unreal Engine over the C++ game logic

[/Script/UnrealEd.ProjectPackagingSettings]
; loaded by path from code, so the cook does not find them on its own: the engine's shapes, our materials and the
; imported 3D assets (UghAssets)
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Game/Generated")
+DirectoriesToAlwaysCook=(Path="/Game/Imported")
; the copies of Epic's samples (not in git, where they are): the Electric Dreams assets the game uses (UghElectricDreams)
; and the MetaHumans by name (UghMetaHumans; not their Creator characters in Characters, which are editor data)
+DirectoriesToAlwaysCook=(Path="/Game/External/ElectricDreams")
+DirectoriesToAlwaysCook=(Path="/Game/External/MetaHumans/Pilot")
+DirectoriesToAlwaysCook=(Path="/Game/External/MetaHumans/Man")
+DirectoriesToAlwaysCook=(Path="/Game/External/MetaHumans/Woman")
+DirectoriesToAlwaysCook=(Path="/Game/External/MetaHumans/Grandpa")
; the shared shader code library, needed by the bundled PSO cache (pso.ps1); its stable keys: DefaultEngine.ini
bShareMaterialShaderCode=True
